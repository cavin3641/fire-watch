<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>화재 현장 상황판</title>

<!-- ★ 아래 YOUR_JAVASCRIPT_KEY 를 카카오 JavaScript 키로 바꾸세요 ★ -->
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_JAVASCRIPT_KEY"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --ink:#0F1319; --panel:#171C25; --line:#252C38;
    --text:#EDF0F4; --dim:#8B96A6;
    --hot:#FF5A1F; --warm:#FFA726; --cool:#5C7A99;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink); color:var(--text);
    font-family:Pretendard,-apple-system,sans-serif;
    display:flex; flex-direction:column;
    font-size:17px;
  }

  header{
    padding:14px 18px calc(14px + env(safe-area-inset-top)) 18px;
    border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:12px;
  }
  header h1{font-size:19px; font-weight:700; letter-spacing:-.02em}
  header .meta{font-size:13px; color:var(--dim); margin-left:auto}
  header .count{color:var(--hot); font-weight:700}

  #map{flex:0 0 52vh; background:var(--panel)}

  #list{
    flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:8px 0 calc(24px + env(safe-area-inset-bottom));
  }

  .card{
    padding:15px 18px; border-bottom:1px solid var(--line);
    display:grid; grid-template-columns:auto 1fr; gap:4px 14px;
    cursor:pointer;
  }
  .card:active{background:var(--panel)}

  /* 경과시간 - 이 화면에서 가장 중요한 정보 */
  .elapsed{
    grid-row:span 3; align-self:start;
    font-size:15px; font-weight:700; font-variant-numeric:tabular-nums;
    padding:6px 9px; border-radius:6px; white-space:nowrap;
    background:rgba(255,90,31,.14); color:var(--hot);
  }
  .elapsed.old{background:rgba(92,122,153,.14); color:var(--cool)}

  .region{font-size:18px; font-weight:700; letter-spacing:-.02em}
  .title{font-size:15px; color:var(--dim); line-height:1.5}
  .tags{display:flex; gap:8px; font-size:13px; color:var(--dim); margin-top:2px}
  .tag{padding:2px 7px; border:1px solid var(--line); border-radius:4px}
  .tag.alert{border-color:var(--hot); color:var(--warm)}

  .empty{padding:60px 24px; text-align:center; color:var(--dim); line-height:1.7}
</style>
</head>
<body>

<header>
  <h1>수도권 화재</h1>
  <span class="meta"><span class="count" id="count">–</span>건 · <span id="updated">불러오는 중</span></span>
</header>

<div id="map"></div>
<div id="list"></div>

<script>
/* ── 설정 ─────────────────────────────────────── */
const CENTER = { lat: 37.6584, lon: 126.8320 };   // 고양시청 기준
const DATA_URL = 'fires.json?t=' + Date.now();    // 캐시 방지

/* ── 지도 만들기 ──────────────────────────────── */
const map = new kakao.maps.Map(document.getElementById('map'), {
  center: new kakao.maps.LatLng(CENTER.lat, CENTER.lon),
  level: 8       // 수도권 전체가 보이는 정도
});

const markers = {};

/* ── 경과시간 계산 ────────────────────────────── */
function elapsedText(iso) {
  if (!iso) return '시각미상';
  const mins = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return '방금';
  if (mins < 60) return mins + '분 전';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + '시간 전';
  return Math.floor(hrs / 24) + '일 전';
}

/* ── 화면 그리기 ──────────────────────────────── */
function render(data) {
  const fires = data.fires || [];
  document.getElementById('count').textContent = fires.length;
  document.getElementById('updated').textContent =
    new Date(data.updated_at).toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'}) + ' 갱신';

  const list = document.getElementById('list');
  list.innerHTML = '';

  if (!fires.length) {
    list.innerHTML = '<div class="empty">수도권에 잡힌 화재 소식이 없습니다.<br>10분마다 자동으로 확인합니다.</div>';
    return;
  }

  const bounds = new kakao.maps.LatLngBounds();

  fires.forEach(f => {
    const pos = new kakao.maps.LatLng(f.lat, f.lon);
    bounds.extend(pos);

    const marker = new kakao.maps.Marker({ map, position: pos, title: f.region });
    markers[f.id] = marker;

    const info = new kakao.maps.InfoWindow({
      content: `<div style="padding:8px 10px;font-size:13px;max-width:220px">
                  <b>${f.region || '위치 미상'}</b><br>${elapsedText(f.published)}
                </div>`
    });
    kakao.maps.event.addListener(marker, 'click', () => info.open(map, marker));

    /* 목록 카드 */
    const isOld = f.published && (Date.now() - new Date(f.published)) > 6 * 3600 * 1000;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="elapsed ${isOld ? 'old' : ''}">${elapsedText(f.published)}</div>
      <div class="region">${f.region || '위치 미상'}</div>
      <div class="title">${f.title || ''}</div>
      <div class="tags">
        <span class="tag ${f.source === '재난문자' ? 'alert' : ''}">${f.source}</span>
        ${f.distance_km != null ? `<span class="tag">${f.distance_km}km</span>` : ''}
      </div>`;
    card.onclick = () => {
      map.setLevel(5);
      map.panTo(pos);
      info.open(map, marker);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    list.appendChild(card);
  });

  map.setBounds(bounds);
}

/* ── 데이터 불러오기 ──────────────────────────── */
fetch(DATA_URL)
  .then(r => r.json())
  .then(render)
  .catch(() => {
    document.getElementById('updated').textContent = '데이터를 못 읽었습니다';
    document.getElementById('list').innerHTML =
      '<div class="empty">fires.json 파일을 찾을 수 없습니다.<br>collect.py 를 먼저 실행하세요.</div>';
  });

/* 5분마다 새로고침 */
setInterval(() => location.reload(), 5 * 60 * 1000);
</script>
</body>
</html>
