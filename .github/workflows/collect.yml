name: fire-watch
on:
  schedule:
          - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: collect
        env:
          SAFETY_DATA_KEY: ${{ secrets.SAFETY_DATA_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python collect.py
      - name: save
        run: |
          git config user.name fire-watch-bot
          git config user.email bot@users.noreply.github.com
          git add docs/fires.json
          git diff --staged --quiet || git commit -m update-fires
          git push
