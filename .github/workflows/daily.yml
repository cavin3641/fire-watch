name: daily-report

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: send
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_SEOUL_NORTH: ${{ secrets.TELEGRAM_CHAT_SEOUL_NORTH }}
          TELEGRAM_CHAT_SEOUL_SOUTH: ${{ secrets.TELEGRAM_CHAT_SEOUL_SOUTH }}
          TELEGRAM_CHAT_INCHEON: ${{ secrets.TELEGRAM_CHAT_INCHEON }}
          TELEGRAM_CHAT_GYEONGGI_NORTH: ${{ secrets.TELEGRAM_CHAT_GYEONGGI_NORTH }}
          TELEGRAM_CHAT_GYEONGGI_WEST: ${{ secrets.TELEGRAM_CHAT_GYEONGGI_WEST }}
          TELEGRAM_CHAT_GYEONGGI_EAST: ${{ secrets.TELEGRAM_CHAT_GYEONGGI_EAST }}
          TELEGRAM_CHAT_GYEONGGI_SOUTH: ${{ secrets.TELEGRAM_CHAT_GYEONGGI_SOUTH }}
        run: python send_daily.py
